# PR은 테스트, main 푸시는 이미지까지 빌드
name: CI

on:
  push:
    branches:
      - main
    # 문서/워크플로우만 바뀌면 건너뜀
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/**'
  # PR에서도 테스트 실행
  pull_request:
    # 문서/워크플로우만 바뀌면 건너뜀
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/**'

jobs:
  hello:
    runs-on: ubuntu-latest
    steps:
      # 인사 메시지 출력
      - name: 인사 출력
        run: echo 'hello ci!'

  # PR과 푸시 모두에서 실행
  test:
    runs-on: ubuntu-latest
    steps:
      # 소스 코드 내려받기
      - name: 소스 체크아웃
        uses: actions/checkout@v7

      # JDK 17 설치
      - name: JDK 17 준비
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # Gradle 캐시로 빌드 속도 향상
      - name: Gradle 환경 준비
        uses: gradle/actions/setup-gradle@v6

      # gradle test 통과 여부 확인
      - name: 전체 테스트 실행
        run: ./gradlew test --no-daemon

  docker:
    # 테스트 통과 후에만 실행
    needs: test
    # main 푸시일 때만 이미지 푸시(PR 제외)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # 소스 코드 내려받기
      - name: 소스 체크아웃
        uses: actions/checkout@v7

      # arm64 에뮬레이션 준비
      - name: QEMU 설정
        uses: docker/setup-qemu-action@v4

      # 멀티플랫폼 빌더 준비
      - name: Buildx 설정
        uses: docker/setup-buildx-action@v4

      # 내장 토큰으로 ghcr 로그인
      - name: GHCR 로그인
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # sha, latest 태그 생성
      - name: 이미지 메타데이터 생성
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      # amd64, arm64 크로스플랫폼 빌드/푸시
      - name: 빌드 및 푸시
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
