# main 푸시 시 테스트를 검증하는 CI
name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  hello:
    runs-on: ubuntu-latest
    steps:
      # 인사 메시지 출력
      - name: 인사 출력
        run: echo 'hello ci!'

  test:
    runs-on: ubuntu-latest
    steps:
      # 소스 코드 내려받기
      - name: 소스 체크아웃
        uses: actions/checkout@v7

      # JDK 17 설치
      - name: JDK 17 준비
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # Gradle 캐시로 빌드 속도 향상
      - name: Gradle 환경 준비
        uses: gradle/actions/setup-gradle@v6

      # gradle test 통과 여부 확인
      - name: 전체 테스트 실행
        run: ./gradlew test --no-daemon
